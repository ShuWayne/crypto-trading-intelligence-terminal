name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        # NOTE: no lockfile exists yet in server/ or client/ (packages were
        # scaffolded without one), so `npm ci` would fail. Use `npm install`
        # until lockfiles are committed, then switch both steps to `npm ci`.
        run: npm install

      - name: Install client dependencies
        working-directory: client
        # NOTE: see above — `npm install` until client/package-lock.json exists.
        run: npm install

      - name: Typecheck and build server
        working-directory: server
        run: npm run build

      - name: Typecheck and build client
        working-directory: client
        run: npm run build

      - name: Run server tests (vitest)
        working-directory: server
        run: npm test
